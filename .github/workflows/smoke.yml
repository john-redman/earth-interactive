name: Smoke

# Browser smoke test (tools/smoke.mjs): search, pin and tag, card, compare, lenses, views, Daily Challenge,
# recenter and deep links, on desktop and phone sizes, in headless Chromium with software WebGL.
# Run it from the Actions tab (Smoke → Run workflow) before a launch or after a big change. It is not a check
# on every pull request: software rendering is slow and the test waits on fixed times, so a slow runner could
# fail it without a real bug. It also runs on pull requests that change this workflow or the test itself.
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/smoke.yml', 'tools/smoke.mjs']

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Playwright with Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build the site with the app
        run: npm run build:pages
      - name: Serve it
        run: python3 -m http.server 5174 --directory dist-pages --bind 127.0.0.1 > /dev/null 2>&1 &
      - name: Smoke test (desktop and phone)
        run: node tools/smoke.mjs
        env:
          BASE: http://127.0.0.1:5174/
