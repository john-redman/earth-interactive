name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: sitemap <lastmod> comes from each file's last commit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax + data consistency
        run: npm run check
      - name: Assemble site (app files)
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js og-image.png css js data vendor icons _site/
          cp LICENSE THIRD_PARTY_NOTICES.md _site/
          # new cache version per deploy, so returning visitors get the update
          sed -i "s/const VERSION = 'dev';/const VERSION = '${GITHUB_SHA::8}';/" _site/sw.js
          grep -q "VERSION = '${GITHUB_SHA::8}'" _site/sw.js
          touch _site/.nojekyll
      - name: Text pages, country + comparison pages, sitemap, robots, 404
        # Copies about/how-to-play/why-maps-lie/privacy/terms/contact.html (+ css/pages.css) with the shared
        # header/footer, and generates countries/, compare/, 404.html, sitemap.xml, robots.txt into _site.
        # Generated pages are never committed. Fails if tools/site.config.mjs and js/site.js / js/analytics.js disagree.
        run: node tools/build-pages.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
